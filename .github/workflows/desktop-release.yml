# Builds the desktop installers and attaches them to a GitHub Release.
# Trigger: push a tag `desktop-v<version>` (the version in apps/desktop/package.json), or run it by hand.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --filter @pick-league/desktop package
        env:
          # No code signing: Windows SmartScreen warns on first launch.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/desktop/dist/*-setup.exe
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: PickLeague-windows
          path: apps/desktop/dist/*-setup.exe
