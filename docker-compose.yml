# PickLeague server stack: Postgres + worker (Riot crawler) + API (http://localhost:3000).
#   cp .env.example .env   # then put your Riot API key in it
#   docker compose up -d
# To reach Postgres from the host (bun run dev:*), see docker-compose.override.example.yml.
name: pick-league

# Keeps each container's logs to 3 files of 10 MB (Docker's default never rotates them).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    # Sized for a 12 GB / 6-core VPS: Postgres gets 7 GB, the API 1 GB, the worker 512 MB, the
    # rest is left to the OS page cache. /dev/shm is big enough for parallel hash joins.
    shm_size: 1g
    mem_limit: 7g
    cpus: 5
    command: >-
      postgres
      -c shared_buffers=3GB
      -c effective_cache_size=8GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c max_wal_size=8GB
      -c max_parallel_workers_per_gather=4
      -c max_parallel_maintenance_workers=2
      -c random_page_cost=1.1
    environment:
      POSTGRES_USER: pickleague
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickleague}
      POSTGRES_DB: pickleague
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickleague -d pickleague"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # The worker is the only service that reads the Riot API key: it gets the whole .env.
  worker:
    <<: *app
    build:
      context: .
      target: worker
    image: pick-league-worker
    mem_limit: 512m
    cpus: 1
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://pickleague:${POSTGRES_PASSWORD:-pickleague}@postgres:5432/pickleague

  # The API only gets its own settings (empty = the API's default), never the Riot key.
  api:
    <<: *app
    build:
      context: .
      target: api
    image: pick-league-api
    mem_limit: 1g
    cpus: 2
    environment:
      DATABASE_URL: postgres://pickleague:${POSTGRES_PASSWORD:-pickleague}@postgres:5432/pickleague
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      STATS_REFRESH_MINUTES: ${STATS_REFRESH_MINUTES:-}
      STATS_MANUAL_REFRESH_COOLDOWN_SECONDS: ${STATS_MANUAL_REFRESH_COOLDOWN_SECONDS:-}
    ports:
      # Loopback only: Docker-published ports bypass ufw. The reverse proxy is the public door.
      - "127.0.0.1:${API_PORT:-3000}:3000"
    # `docker compose ps` shows "unhealthy" when /health stops answering (the slim image has no curl).
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # TLS reverse proxy, the only service reachable from the internet (ports 80 + 443).
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
